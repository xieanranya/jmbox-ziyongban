name: Release Android APK

# 推 v* tag 时：把仓库 release/ 下的 APK 挂到同名 Release（不存在则自动创建）。
# 约定：发新版 = 升 pubspec 版本号 → 放 release/JmBox_vX.Y.Z.apk → 打 tag vX.Y.Z 推送。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release_apk:
    name: Attach APK to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 挂 APK 到 Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          make_latest: true
          tag_name: ${{ github.ref_name }}
          name: JmBox ${{ github.ref_name }}
          body: |
            ## JmBox ${{ github.ref_name }}

            **修复**
            - 首页标签排序：最新A漫稳定紧跟连载更新（兼容繁体/标题变体，不同接口线路下排布一致）
            - 安卓与 iOS 首页布局现已完全一致

            **文件**
            - `JmBox_v1.0.51.apk`：Android 安装包（debug 签名，直接安装）
            - `nosign.ipa`：iOS 未签名安装包（Sideloadly / AltStore 签名后安装）
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
