name: Build iOS (unsigned IPA)

# 触发方式：推送到 main 自动构建，或在 Actions 页面手动 Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'release/**'

permissions:
  contents: write

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 缓存 Dart 依赖与 CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: macos-deps-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock') }}
          restore-keys: |
            macos-deps-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter 版本
        run: flutter --version

      - name: 生成 iOS 平台工程
        # 原仓库未提供 ios/ 目录，这里生成标准 Flutter iOS 模板
        run: flutter create --platforms=ios --project-name jmbox --org com.jmbox .

      - name: 替换 App 图标
        # 使用自定义图标（assets/app_icon/）覆盖 Flutter 默认图标
        run: |
          set -e
          ICONSET=ios/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          rm -f "$ICONSET"/*.png
          cp assets/app_icon/Icon-*.png "$ICONSET"/
          cp assets/app_icon/Contents.json "$ICONSET"/Contents.json
          echo "--- 已安装的图标文件 ---"
          ls "$ICONSET"

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios
          pod install
        continue-on-error: true

      - name: 配置 Info.plist
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName JmBox" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string JmBox" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 保存图片到相册" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 读取相册图片" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
          echo "--- 配置结果 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"

      - name: 编译 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 IPA
        run: |
          cd build
          rm -rf Payload
          mkdir Payload
          APP=$(find ios -name "Runner.app" -maxdepth 4 -type d | head -1)
          echo "找到 App: $APP"
          cp -R "$APP" Payload/
          zip -r -9 nosign.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: jmbox-nosign.ipa
          path: build/nosign.ipa
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          make_latest: false
          tag_name: ios-build-${{ github.run_number }}
          name: JmBox iOS #${{ github.run_number }}
          body: |
            自动构建的 iOS 未签名安装包（JmBox）。

            - 产物：`jmbox-nosign.ipa`
            - 未签名，需用 Sideloadly / AltStore 等工具签名后安装到 iPhone
            - 构建时间：${{ github.run_number }} 号流水线
          files: build/nosign.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 完成提示
        run: |
          echo "=========================================="
          echo " iOS 包构建完成"
          echo "已发布到 Releases，可直接下载"
          echo "需用 Sideloadly / AltStore 签名后安装"
          echo "=========================================="

      - name: 保持安卓版为 Latest（iOS 发布后重新钉回）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d'+' -f1)
          TAG="v$VERSION"
          echo "重新固定 Latest 到 $TAG"
          RELEASE_ID=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "安卓 Release $TAG 不存在（尚未发布），跳过"
            exit 0
          fi
          curl -sSf -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -d '{"make_latest": "true"}'
          IOS_ID=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/ios-build-$GITHUB_RUN_NUMBER" | jq -r '.id' || echo null)
          if [ -n "$IOS_ID" ] && [ "$IOS_ID" != "null" ]; then
            curl -sSf -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$IOS_ID" \
              -d '{"make_latest": "false"}' || echo "iOS 设为非 latest 失败（不阻塞）"
          fi
