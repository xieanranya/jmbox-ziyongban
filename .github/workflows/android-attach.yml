name: Attach Android APK to v7

# 一次性任务：构建安卓 APK 并挂到已发布的 ios-build-7 版本下。
# 触发条件：本文件或 android 配置变化时运行（用于把 APK 挂到 Release）。
on:
  push:
    paths:
      - '.github/workflows/android-attach.yml'
      - 'android/**'

permissions:
  contents: write

jobs:
  attach_apk:
    name: Attach APK to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 挂到 ios-build-7 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-7
          name: JmBox iOS #7
          body: |
            第 7 版（iOS + Android）

            - `nosign.ipa`：iOS 未签名安装包，需用 Sideloadly / AltStore 签名后安装
            - `JmBox_v1.0.48.apk`：Android 安装包（debug 签名，直接安装）
          files: release/JmBox_v1.0.48.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
